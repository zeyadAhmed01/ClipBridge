name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile-check Python files
        run: python -m py_compile clipboard_bridge.py tests/test_clipbridge.py

      - name: Validate JSON configuration files
        run: |
          python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ('http_shortcuts_android.json', 'config.example.json')]"

      - name: Run unit and HTTP integration tests
        run: python -m unittest discover -s tests -v
